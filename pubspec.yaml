name: hisaab
description: "Hisaab — SMS-based personal finance tracker. Android-first."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.2
  drift: ^2.35.3
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.6
  path: ^1.9.1
  google_fonts: ^9.0.0
  intl: ^0.20.3
  fl_chart: ^1.3.0
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.10.10
  permission_handler: 12.0.1
  share_plus: ^13.3.1
  crypto: ^3.0.8
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  riverpod_generator: ^4.0.9
  flutter_launcher_icons: ^0.14.3

# App icon: run `dart run flutter_launcher_icons` after changing the PNGs.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#C6F432"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fixtures/